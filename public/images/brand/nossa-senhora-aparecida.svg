<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 108" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="te-aparecida-gold" x1="40" y1="2" x2="40" y2="106" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D8B45B"/>
      <stop offset="0.55" stop-color="#C99B32"/>
      <stop offset="1" stop-color="#B8872A"/>
    </linearGradient>
  </defs>
  <g
    stroke="url(#te-aparecida-gold)"
    stroke-linecap="round"
    stroke-linejoin="round"
    shape-rendering="geometricPrecision"
  >
    <!-- crown: three triangular points on a bar -->
    <path stroke-width="2" d="M29 20 L33.5 9 L37.5 18.5 L40 5 L42.5 18.5 L46.5 9 L51 20"/>
    <path stroke-width="1.75" d="M29 20 H51"/>
    <!-- circular head -->
    <circle cx="40" cy="31.5" r="8" stroke-width="2"/>
    <!-- shoulder / cloak opening -->
    <path stroke-width="1.6" d="M33.5 39 C34.5 42.5 36.5 44.5 40 44.5 C43.5 44.5 45.5 42.5 46.5 39"/>
    <!-- bell-shaped cloak -->
    <path
      stroke-width="2"
      d="M30 45.5
         C21 58 16.5 76 18.5 97.5
         L40 103
         L61.5 97.5
         C63.5 76 59 58 50 45.5"
    />
    <!-- fine vertical folds -->
    <path stroke-width="1.35" d="M33.5 51 C28.5 66 27.5 82 30.5 97"/>
    <path stroke-width="1.35" d="M46.5 51 C51.5 66 52.5 82 49.5 97"/>
    <path stroke-width="1.15" d="M37 55 C35.2 70 35.2 85 37 98.5"/>
    <path stroke-width="1.15" d="M43 55 C44.8 70 44.8 85 43 98.5"/>
    <!-- center fold -->
    <path stroke-width="1.2" d="M40 46.5 V93"/>
    <!-- tiny cross at base -->
    <path stroke-width="1.85" d="M40 94.5 V103.5 M36.5 98 H43.5"/>
  </g>
</svg>
